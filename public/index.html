<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同词相遇 · 联机版</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8ff;color:#433852;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}.wrap{max-width:650px;margin:35px auto;padding:18px}h1{font-size:34px;color:#74559a;margin-bottom:4px}.sub{color:#93869e}.card{background:white;border-radius:22px;padding:24px;margin-top:20px;box-shadow:0 8px 35px #61437a12}input,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #e1d8ec}input{width:100%;margin:7px 0 14px}button{border:0;background:#8165a9;color:white;cursor:pointer;font-weight:700;margin:6px 4px 6px 0}button.secondary{background:#eae2f6;color:#6d5688}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tag{background:#eee8f9;padding:8px 12px;border-radius:12px;display:inline-block;margin:5px}.muted{color:#9c90a5}.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}.word{padding:13px;border-radius:12px;background:#e5f5f3;color:#428c88;overflow-wrap:anywhere}.word:nth-child(3n){background:#fff0d8;color:#b4823d}.word:nth-child(3n+1){background:#eee7fb;color:#8262a8}.big{font-size:26px;color:#6e5195;font-weight:800}.hide{display:none}.hist{border-top:1px solid #eee;padding:12px 0}.notice{color:#c14b66;min-height:20px}</style></head><body><div class="wrap"><h1>同词相遇 ✨</h1><div class="sub">不同的脑回路，终会在同一个词相遇</div><div id="setup" class="card"><label>你的昵称</label><input id="name" maxlength="16" placeholder="输入昵称"><div class="row"><button onclick="create()">创建房间</button></div><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><label>加入朋友的房间</label><input id="code" inputmode="numeric" maxlength="6" placeholder="6位房间号"><button class="secondary" onclick="join()">加入房间</button></div><div id="game" class="hide"><div class="card"><div class="row"><span class="big">房间 <span id="roomCode"></span></span><button class="secondary" onclick="share()">复制邀请链接</button></div><div id="players"></div><div class="muted" id="status"></div></div><div class="card" id="stage"></div><div class="card"><b>每轮记录</b><div id="history"></div></div></div><p class="notice" id="notice"></p></div><script src="/socket.io/socket.io.js"></script><script>
const s=io();let me='',room='',token='',state=null;const $=id=>document.getElementById(id);const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);if(params.get('room'))$('code').value=params.get('room');$('name').value=localStorage.getItem('word-name')||'';
function identity(){let n=$('name').value.trim();if(!n){$('notice').textContent='先输入昵称';return null}localStorage.setItem('word-name',n);return n}
function create(){const n=identity();if(n)s.emit('create',n)}function join(){const n=identity();if(n)s.emit('join',{code:$('code').value.trim(),name:n,token:localStorage.getItem('word-token-'+$('code').value.trim())||null})}
s.on('connect',()=>{if(room&&token)s.emit('join',{code:room,name:localStorage.getItem('word-name'),token});else if(params.get('room')&&localStorage.getItem('word-token-'+params.get('room'))){s.emit('join',{code:params.get('room'),name:localStorage.getItem('word-name'),token:localStorage.getItem('word-token-'+params.get('room'))})}});
s.on('joined',d=>{room=d.code;me=d.id;token=d.token;localStorage.setItem('word-token-'+room,token);history.replaceState({},'', '?room='+room);$('setup').classList.add('hide');$('game').classList.remove('hide');$('notice').textContent=''});s.on('notice',x=>$('notice').textContent=x);s.on('state',r=>{state=r;render()});
function share(){const url=location.origin+location.pathname+'?room='+room;navigator.clipboard?.writeText(url).then(()=>$('notice').textContent='邀请链接已复制').catch(()=>$('notice').textContent=url)}
function render(){if(!state)return;const r=state;const host=r.host===me;const mine=r.players.find(p=>p.id===me);$('roomCode').textContent=r.code;$('players').innerHTML=r.players.map(p=>`<span class="tag">${safe(p.name)}${p.id===r.host?' 👑':''} ${p.online?'🟢':'⚪'}${r.phase==='writing'?(p.submitted?' ✓':' …'):''}</span>`).join('');$('status').textContent=`${r.players.length} 人 · 第 ${r.round} 轮`;let html='';if(r.phase==='lobby'){html='<h2>等待玩家加入</h2><p>邀请至少一位朋友加入房间，然后开始游戏。</p>'+(host?'<button onclick="s.emit(\'start\')">开始游戏</button>':'<p class="muted">等待房主开始…</p>')}if(r.phase==='writing'){html=`<h2>第 ${r.round} 轮 · 默契挑战</h2>`+(r.round===1?'<p>独立想一个词，不要告诉其他人。</p>':'<p>根据上一轮大家的词，想一个能连接它们的共性词。</p>')+(mine?.submitted?'<p class="big">✓ 已提交，等待其他人…</p>':'<input id="wordInput" maxlength="40" placeholder="输入你的词（提交后不可修改）"><button onclick="sendWord()">提交答案</button>')+`<p class="muted">已提交 ${r.players.filter(p=>p.submitted).length}/${r.players.length}</p>`}if(r.phase==='reveal'||r.phase==='won'){html=`<h2>${r.phase==='won'?'🎉 脑回路相遇了！':'第 '+r.round+' 轮 · 答案揭晓'}</h2><div class="words">`+r.words.map(w=>`<div class="word"><small>${safe(w.name)}</small><div style="font-size:20px;font-weight:700">${safe(w.word)}</div></div>`).join('')+'</div>'+(r.phase==='won'?`<p class="big">用了 ${r.round} 轮，大家终于想到了一起！</p>`:(host?'<p><button onclick="s.emit(\'next\')">进入下一轮 →</button></p>':'<p class="muted">等待房主开启下一轮…</p>'))+(host&&r.phase==='won'?'<button class="secondary" onclick="s.emit(\'restart\')">再玩一局</button>':'')} $('stage').innerHTML=html;$('history').innerHTML=r.history.length?r.history.map(h=>`<div class="hist"><b>第 ${h.round} 轮</b><div class="words">${h.words.map(w=>`<div class="word"><small>${safe(w.name)}</small><div>${safe(w.word)}</div></div>`).join('')}</div></div>`).join(''):'<p class="muted">暂无记录</p>'}
function sendWord(){const w=$('wordInput').value.trim();if(w)s.emit('submit',w)}
</script></body></html>
